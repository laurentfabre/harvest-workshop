name: Vérifier le kit Harvest
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install duckdb==1.5.3
      - run: python scripts/build.py
      - run: python scripts/verify_semantics.py
      - run: python scripts/verify_eres.py
      - run: python scripts/check_distribution.py
      - name: Vérifier aussi le kit téléchargé depuis le dépôt
        run: |
          git diff --exit-code -- participant/
          git show HEAD:harvest-participant.zip > "$RUNNER_TEMP/checked-in-kit.zip"
          python scripts/check_distribution.py "$RUNNER_TEMP/checked-in-kit.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-atelier
          path: |
            harvest-participant.zip
            participant/notebooks/00_DEMARRER.ipynb
